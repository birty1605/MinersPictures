<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Miners Arms - Live TV Photo Display & Hub</title>
    <!-- Google Fonts for The Miners Arms Theme -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Alex+Brush&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase & Cloudinary Integration Engine -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Cleaned Firebase configuration (Firestore optimized)
        const firebaseConfig = {
          apiKey: "AIzaSyDfoySaIshh6WDekGK2c_ybxyqqlCOEW7g",
          authDomain: "minerspictures.firebaseapp.com",
          projectId: "minerspictures",
          storageBucket: "minerspictures.firebasestorage.app",
          messagingSenderId: "812113201476",
          appId: "1:812113201476:web:f32b0e323d46972d07af11",
          measurementId: "G-62MLMY1VV7"
        };

        // Cloudinary Configuration
        const CLOUDINARY_CLOUD_NAME = 'vju0scal';
        const CLOUDINARY_UPLOAD_PRESET = 'miners_preset';

        // Initialize Firebase Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let selectedFileObject = null;
        let currentSlideIndex = 0;
        let slideshowInterval = null;
        let isAdminLoggedIn = false;
        let cachedPhotos = [];

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.nav-tabs .tab-btn').forEach(btn => {
                btn.addEventListener('click', (e) => switchTab(e.currentTarget.getAttribute('data-tab')));
            });

            const dropzoneBox = document.getElementById('dropzoneBox');
            const fileInput = document.getElementById('fileInput');
            if (dropzoneBox && fileInput) {
                dropzoneBox.addEventListener('click', () => fileInput.click());
                fileInput.addEventListener('change', previewFile);
            }

            const uploadForm = document.getElementById('uploadForm');
            if (uploadForm) uploadForm.addEventListener('submit', (e) => handleImageUpload(e, db));

            const loginForm = document.getElementById('loginForm');
            if (loginForm) loginForm.addEventListener('submit', handleAdminLogin);

            const fullscreenBtn = document.getElementById('fullscreenBtn');
            if (fullscreenBtn) fullscreenBtn.addEventListener('click', enterFullscreen);

            const simulateAgingBtn = document.getElementById('simulateAgingBtn');
            if (simulateAgingBtn) simulateAgingBtn.addEventListener('click', () => simulateAging(db));

            // Initialize Real-time Firestore Sync
            initRealtimeSync(db);
        });

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            const targetTab = document.getElementById('tab-' + tabId);
            if (targetTab) targetTab.classList.add('active');

            const targetBtn = document.querySelector(`.nav-tabs [data-tab="${tabId}"]`);
            if (targetBtn) targetBtn.classList.add('active');

            if (tabId === 'tv') {
                initSlideshow();
            } else if (tabId === 'admin' && isAdminLoggedIn) {
                renderAdminQueues();
            }
        }

        function previewFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            selectedFileObject = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                const previewImg = document.getElementById('imagePreview');
                const previewBox = document.getElementById('previewBox');
                if (previewImg && previewBox) {
                    previewImg.src = e.target.result;
                    previewBox.style.display = 'block';
                }
            };
            reader.readAsDataURL(file);
        }

        async function handleImageUpload(e, db) {
            e.preventDefault();
            if (!selectedFileObject) {
                showAlert('uploadAlert', 'Please select a picture first.', 'error');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            if (submitBtn) {
                submitBtn.innerText = 'Uploading to Cloudinary...';
                submitBtn.disabled = true;
            }

            try {
                const formData = new FormData();
                formData.append('file', selectedFileObject);
                formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

                const cloudinaryRes = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
                    method: 'POST',
                    body: formData
                });

                if (!cloudinaryRes.ok) throw new Error('Cloudinary upload failed.');
                const cloudinaryData = await cloudinaryRes.json();
                const imageUrl = cloudinaryData.secure_url;

                if (submitBtn) submitBtn.innerText = 'Saving to Real-time Database...';

                await addDoc(collection(db, "photos"), {
                    dataUrl: imageUrl,
                    status: 'pending',
                    timestamp: Date.now()
                });

                if (submitBtn) {
                    submitBtn.innerText = '🚀 Submit Picture for Approval';
                    submitBtn.disabled = false;
                }

                showAlert('uploadAlert', 'Picture uploaded successfully! Awaiting admin review.', 'success');
                document.getElementById('uploadForm').reset();
                document.getElementById('previewBox').style.display = 'none';
                selectedFileObject = null;
            } catch (err) {
                console.error('Upload error:', err);
                showAlert('uploadAlert', 'Upload failed. Check your Cloudinary unsigned preset settings.', 'error');
                if (submitBtn) {
                    submitBtn.innerText = '🚀 Submit Picture for Approval';
                    submitBtn.disabled = false;
                }
            }
        }

        function handleAdminLogin(e) {
            e.preventDefault();
            const userField = document.getElementById('adminUser');
            const passField = document.getElementById('adminPass');
            if (!userField || !passField) return;

            const enteredUser = userField.value.trim();
            const enteredPass = passField.value.trim();

            if (enteredUser === 'Gjelly' && enteredPass === 'Kevisthebest') {
                isAdminLoggedIn = true;
                document.getElementById('adminLoginCard').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
                renderAdminQueues();
            } else {
                showAlert('loginAlert', 'Invalid username or password.', 'error');
            }
        }

        function initRealtimeSync(db) {
            const q = query(collection(db, "photos"), orderBy("timestamp", "desc"));
            onSnapshot(q, (snapshot) => {
                cachedPhotos = [];
                snapshot.forEach((docSnap) => {
                    cachedPhotos.push({
                        id: docSnap.id,
                        ...docSnap.data()
                    });
                });

                if (isAdminLoggedIn) renderAdminQueues();
                
                const tvTab = document.getElementById('tab-tv');
                if (tvTab && tvTab.classList.contains('active')) {
                    initSlideshow();
                }
            }, (error) => {
                console.error("Firestore sync error:", error);
                const screen = document.getElementById('tvScreen');
                if (screen) {
                    screen.innerHTML = `<div class="tv-slide active" style="display:flex; flex-direction:column; justify-content:center; align-items:center; color: var(--accent-red);"><p>Connection Error. Check Firestore Rules.</p></div>`;
                }
            });
        }

        window.updatePhotoStatus = async function(id, newStatus) {
            try {
                const photoRef = doc(db, "photos", id);
                const updates = { status: newStatus };
                if (newStatus === 'live') updates.timestamp = Date.now();
                await updateDoc(photoRef, updates);
            } catch (err) {
                console.error("Error updating status:", err);
            }
        };

        window.deletePhoto = async function(id) {
            if (!confirm('Are you sure you want to delete this picture?')) return;
            try {
                await deleteDoc(doc(db, "photos", id));
            } catch (err) {
                console.error("Error deleting photo:", err);
            }
        };

        window.simulateAging = async function(db) {
            const sevenMonthsAgo = Date.now() - (200 * 24 * 60 * 60 * 1000);
            for (let p of cachedPhotos) {
                if (p.status === 'live') {
                    await updateDoc(doc(db, "photos", p.id), { timestamp: sevenMonthsAgo, status: 'archived' });
                }
            }
            alert('Simulation applied: All live pictures moved to archive.');
        };

        function renderAdminQueues() {
            const pendingQ = document.getElementById('pendingQueue');
            const liveQ = document.getElementById('liveQueue');
            const archiveQ = document.getElementById('archiveQueue');
            if (!pendingQ) return;

            pendingQ.innerHTML = '';
            liveQ.innerHTML = '';
            archiveQ.innerHTML = '';

            const pending = cachedPhotos.filter(p => p.status === 'pending');
            const live = cachedPhotos.filter(p => p.status === 'live');
            const archived = cachedPhotos.filter(p => p.status === 'archived');

            document.getElementById('pendingCountBadge').innerText = `${pending.length} Pending`;
            document.getElementById('liveCountBadge').innerText = `${live.length} Live`;
            document.getElementById('archiveCountBadge').innerText = `${archived.length} Archived`;

            pendingQ.innerHTML = pending.length === 0 ? `<p style="color:var(--text-muted); grid-column: 1/-1; text-align:center;">No pending pictures.</p>` :
                pending.map(p => createPhotoCardHTML(p, `<button class="action-btn btn-approve" onclick="updatePhotoStatus('${p.id}', 'live')">Approve</button><button class="action-btn btn-reject" onclick="deletePhoto('${p.id}')">Reject</button>`)).join('');

            liveQ.innerHTML = live.length === 0 ? `<p style="color:var(--text-muted); grid-column: 1/-1; text-align:center;">No live pictures.</p>` :
                live.map(p => createPhotoCardHTML(p, `<button class="action-btn btn-reject" onclick="deletePhoto('${p.id}')">Delete</button>`)).join('');

            archiveQ.innerHTML = archived.length === 0 ? `<p style="color:var(--text-muted); grid-column: 1/-1; text-align:center;">No archived pictures.</p>` :
                archived.map(p => createPhotoCardHTML(p, `<button class="action-btn btn-restore" onclick="updatePhotoStatus('${p.id}', 'live')">Restore</button><button class="action-btn btn-reject" onclick="deletePhoto('${p.id}')">Delete</button>`)).join('');
        }

        function createPhotoCardHTML(photo, actionsHTML) {
            const dateStr = new Date(photo.timestamp).toLocaleDateString();
            return `
                <div class="photo-card">
                    <img src="${photo.dataUrl}" class="photo-thumb" alt="Upload" loading="lazy">
                    <div class="photo-info">
                        <div class="photo-meta">Added: ${dateStr}</div>
                        <div class="photo-actions">${actionsHTML}</div>
                    </div>
                </div>
            `;
        }

        function initSlideshow() {
            const livePhotos = cachedPhotos.filter(p => p.status === 'live');
            const screen = document.getElementById('tvScreen');
            const counter = document.getElementById('tvCounter');
            if (!screen) return;

            if (livePhotos.length === 0) {
                if (slideshowInterval) clearInterval(slideshowInterval);
                screen.innerHTML = `
                    <div class="tv-slide active" style="display:flex; flex-direction:column; justify-content:center; align-items:center; color: var(--text-muted);">
                        <p style="font-size: 1.2rem; font-family:'Cinzel', serif;">No live pictures available yet.</p>
                        <p style="font-size: 0.9rem; margin-top: 0.5rem;">Upload and approve pictures to begin slideshow.</p>
                    </div>
                `;
                if (counter) counter.innerText = `0 / 0 Slides`;
                return;
            }

            const existingSlides = screen.querySelectorAll('.tv-slide');
            if (existingSlides.length !== livePhotos.length) {
                screen.innerHTML = livePhotos.map((p, idx) => `
                    <div class="tv-slide ${idx === 0 ? 'active' : ''}" data-index="${idx}">
                        <img src="${p.dataUrl}" alt="Live slide">
                    </div>
                `).join('');

                if (slideshowInterval) clearInterval(slideshowInterval);
                currentSlideIndex = 0;
                if (counter) counter.innerText = `Slide 1 / ${livePhotos.length}`;

                slideshowInterval = setInterval(() => {
                    const slides = screen.querySelectorAll('.tv-slide');
                    if (slides.length <= 1) return;

                    slides[currentSlideIndex].classList.remove('active');
                    currentSlideIndex = (currentSlideIndex + 1) % slides.length;
                    slides[currentSlideIndex].classList.add('active');
                    if (counter) counter.innerText = `Slide ${currentSlideIndex + 1} / ${slides.length}`;
                }, 5000);
            }
        }

        function enterFullscreen() {
            const tvEl = document.querySelector('.tv-wrapper');
            if (!tvEl) return;
            if (tvEl.requestFullscreen) {
                tvEl.requestFullscreen();
            } else if (tvEl.webkitRequestFullscreen) {
                tvEl.webkitRequestFullscreen();
            }
        }

        function showAlert(elementId, message, type) {
            const el = document.getElementById(elementId);
            if (!el) return;
            el.innerText = message;
            el.className =
